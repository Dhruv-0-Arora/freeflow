[package]
name = "freeflow-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
freeflow-config.workspace = true
freeflow-core.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# Test fixture: a fake agent CLI used to exercise the worker pool's failure
# paths without spawning a real harness. Not installed by the Nix package.
[[bin]]
name = "freeflow-mock-harness"
path = "src/bin/freeflow-mock-harness.rs"

[lib]
name = "freeflow_llm"
path = "src/lib.rs"

[dev-dependencies]
freeflow-config.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
